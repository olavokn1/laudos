<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" type="image/svg+xml" href="icons/estacao.svg"><link rel="apple-touch-icon" href="icons/estacao-180.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f1a20">
<title>Estação de Laudos</title>
<style>
:root{--bg:#000;--panel:#0d1014;--line:#23292f;--fg:#e3e8ec;--muted:#8d9aa6;--accent:#5fb3c9;--ink:#0c1a1f;--err:#e57373;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:16px}
form{width:min(360px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px}
h1{font-size:18px;margin:0}p{margin:0;color:var(--muted);font-size:13.5px}
input[type=password]{background:#000;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--fg);font-size:16px}
input[type=password]:focus{outline:2px solid var(--accent);border-color:var(--accent)}
label{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted)}
button{background:var(--accent);color:var(--ink);border:0;border-radius:8px;padding:10px;font-weight:700;font-size:15px;cursor:pointer}
#err{color:var(--err);font-size:13px;min-height:18px}
</style></head><body>
<form id="f" autocomplete="off">
<h1>Estação de Laudos</h1>
<p>Digite a senha para abrir.</p>
<input type="password" id="pw" autocomplete="current-password" autofocus>
<label><input type="checkbox" id="rem"> Lembrar neste computador (só em computador pessoal)</label>
<button type="submit" id="go">Abrir</button>
<div id="err"></div>
</form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const KEY="laudos.key";
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
async function open(raw){
  const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const gz=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.i)},key,b64(P.d));
  const html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open();document.write(html);document.close();
}
async function derive(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64(P.s),iterations:P.n,hash:"SHA-256"},base,256));
}
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){navigator.serviceWorker.register("sw.js").catch(()=>{})}
if(location.hash==="#sair"){ls(KEY,null);history.replaceState(null,"",location.pathname)}
const saved=ls(KEY);
if(saved){open(b64(saved)).catch(()=>{ls(KEY,null)})}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();const err=document.getElementById("err"),go=document.getElementById("go");
  err.textContent="";go.disabled=true;go.textContent="Abrindo…";
  const rem=document.getElementById("rem").checked;
  try{const raw=await derive(document.getElementById("pw").value);
    await crypto.subtle.decrypt; if(rem) ls(KEY,btoa(String.fromCharCode(...raw)));
    await open(raw).catch(x=>{ls(KEY,null);throw x});
  }catch(x){err.textContent="Senha incorreta.";go.disabled=false;go.textContent="Abrir";}
});
